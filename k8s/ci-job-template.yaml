# REFERENCE ONLY — this is what the CI Runner generates at runtime via
# src/pipeline/runner/job-spec.ts (names/labels/env filled per run). It is not
# applied directly; it documents the shape of a CI Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: helmsman-ci-<run-id-prefix>
  namespace: default
  labels:
    app.kubernetes.io/managed-by: helmsman
    helmsman/run-id: <run-id>
    helmsman/kind: ci
spec:
  backoffLimit: 0 # one-shot, no retries
  activeDeadlineSeconds: 600 # maxDurationSec; K8s fails the Job as DeadlineExceeded
  ttlSecondsAfterFinished: 1800 # auto-cleanup after 30m (reconcile window)
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: helmsman
        helmsman/run-id: <run-id>
        helmsman/kind: ci
    spec:
      restartPolicy: Never
      containers:
        - name: ci
          image: node:20
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /workspace && cd /workspace
              git init -q
              git remote add origin "$REPO_URL"
              if git fetch -q --depth 1 origin "$COMMIT_SHA"; then
                git checkout -q FETCH_HEAD
              else
                git fetch -q --depth 50 origin "$BRANCH"
                git checkout -q "$COMMIT_SHA"
              fi
              npm ci
              npm test
          env:
            - name: REPO_URL
              value: https://github.com/Junaid1cr/Dummy-app.git
            - name: COMMIT_SHA
              value: <commit-sha>
            - name: BRANCH
              value: main
            - name: CI
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
